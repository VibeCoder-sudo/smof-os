<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Smof: Android style emoji (Noto Color Emoji) and wide Unicode coverage through the Noto families -->
<fontconfig>
  <alias binding="same"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Google Sans Flex</family><family>Noto Sans</family><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>DejaVu Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Adwaita Mono</family><family>DejaVu Sans Mono</family><family>Noto Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <!-- emoji that have both a text and a picture form show as pictures -->
  <match target="pattern"><test name="family"><string>Google Sans Flex</string></test><edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit></match>
</fontconfig>
