[core]
plugins = autostart animate move resize place grid window-rules ipc ipc-rules command switcher decoration wm-actions foreign-toplevel blur
close_top_view = <super> KEY_Q | <alt> KEY_F4
background_color = 0.059 0.051 0.086 1.0

[autostart]
autostart_wf_shell = false
shell = /usr/local/bin/smof-shell
tiler = /usr/local/bin/smof-tiler
front = /usr/local/bin/smof-front
devwatch = /usr/local/bin/smof-devwatch
downloads = /usr/local/bin/smof-downloads
health = /usr/local/bin/smof-health
night = /usr/local/bin/smof-night apply
startup = sh -c "sleep 2; /usr/local/bin/smof-sound startup"
xhost = sh -c "sleep 3; DISPLAY=:0 xhost +si:localuser:root"
a11y = busctl --user set-property org.a11y.Bus /org/a11y/bus org.a11y.Status IsEnabled b true
clip_text = wl-paste --type text --watch cliphist store
clip_image = wl-paste --type image --watch cliphist store

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_screenshot = KEY_PRINT
command_screenshot = /usr/local/bin/smof-shot full
binding_screenshot_area = <ctrl> <shift> KEY_S
command_screenshot_area = /usr/local/bin/smof-shot area
binding_record = <super> <shift> KEY_R
command_record = /usr/local/bin/smof-record full
binding_record_area = <super> <ctrl> KEY_R
command_record_area = /usr/local/bin/smof-record area
binding_volup = KEY_VOLUMEUP
command_volup = /usr/local/bin/smof-volume up
binding_voldown = KEY_VOLUMEDOWN
command_voldown = /usr/local/bin/smof-volume down
binding_mute = KEY_MUTE
command_mute = /usr/local/bin/smof-volume mute
binding_spotlight = <super> KEY_SPACE
command_spotlight = /usr/local/bin/smof-ipc launcher launcher toggle
binding_clipboard = <super> KEY_V
command_clipboard = sh -c "/usr/local/bin/smof-ipc launcher launcher open; sleep 0.4; wtype -d 30 clipboard"
binding_layout = <ctrl> KEY_SPACE
command_layout = /usr/local/bin/smof-input layouts rotate

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 350ms circle
view_thumbnail_rotation = 20

[move]
activate = <alt> BTN_LEFT

[resize]
activate = <alt> BTN_RIGHT

[wm-actions]
toggle_maximize = <super> KEY_UP
minimize = <super> KEY_DOWN

[blur]
method = kawase
kawase_offset = 5
kawase_iterations = 4
kawase_degrade = 3
saturation = 1.3
alpha_threshold = 0.1
blur_by_default = app_id is "smof-bar" | app_id is "smof-dock" | app_id is "smof-toasts" | app_id is "smof-launcher" | type is "unmanaged"

[decoration]
font = Google Sans Flex
font_scale = 0.55
font_color = \#FFFFFFFF
title_height = 44
border_size = 6
button_order = minimize maximize close
button_scale = 0.8
button_padding = 8
active_color = \#6B4FA8F0
inactive_color = \#8573B8CC

[pixdecor]
border_size = 1
titlebar = always
title_font = Google Sans Flex 12
title_text_align = 0
fg_color = 0.957 0.945 0.988 0.98
bg_color = 0.925 0.914 0.969 0.95
fg_text_color = 0.09 0.07 0.16 1.0
bg_text_color = 0.09 0.07 0.16 0.55
button_layout = :minimize,maximize,close
button_color = 0.09 0.07 0.16 0.9
button_line_thickness = 1.0
right_button_spacing = 18
right_button_x_offset = -10
overlay_engine = none

[rounded-corners]
radius = 36
border_size = 0
border_color = 1.0 1.0 1.0 0.0
shadow_softness = 0
shadow_margin = 0
shadow_color = 0.0 0.0 0.0 0.0

[input]
mouse_accel_profile = flat
mouse_cursor_speed = 0

[output:Virtual-1]
mode = 1920x1200@60
scale = 1.5
