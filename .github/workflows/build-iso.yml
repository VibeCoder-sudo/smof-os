name: build-smof-iso
on:
  workflow_dispatch: {}
jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: tools
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
      - name: build the image
        run: bash base/iso/build.sh
      - name: keep the image
        uses: actions/upload-artifact@v4
        with:
          name: smof-iso
          path: base/iso/out/*
          retention-days: 14
