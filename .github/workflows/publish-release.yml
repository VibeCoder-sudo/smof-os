name: publish-smof-iso
# takes the image of a finished build and puts it into a release, all inside GitHub, so any machine can download it with a plain link
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "id of the finished build run"
        required: true
      tag:
        description: "release tag"
        required: true
        default: "test-1"
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: fetch the image from the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n smof-iso -D out
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "${{ inputs.tag }}" out/* -R "${{ github.repository }}" --prerelease \
            --title "Smof live image ${{ inputs.tag }}" \
            --notes "First test image for x86_64 PCs. Not an installer. Boots into the Smof desktop as the live user."
